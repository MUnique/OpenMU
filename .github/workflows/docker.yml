name: Docker images

# Publishes the Docker images to Docker Hub when the project version (see src/SharedAssemblyInfo.cs)
# was increased, i.e. when Docker Hub doesn't contain the image munique/openmu with this version yet.
# The images get the version (e.g. 1.2.3) and 'latest' as tags.
# The images are only built when they are going to be published.
# Publishing requires the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  check:
    name: Check if the version is published
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}

    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Hub for the project version
        id: check
        run: |
          version=$(grep -oP '^\[assembly: AssemblyVersion\("\K[0-9]+\.[0-9]+\.[0-9]+' src/SharedAssemblyInfo.cs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl --silent --fail --location "https://hub.docker.com/v2/repositories/munique/openmu/tags/$version" > /dev/null; then
            echo "Version $version is already published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $version is not published yet."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: ${{ matrix.image }}
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: openmu
            dockerfile: src/Startup/Dockerfile
          - image: openmu-admin
            dockerfile: src/Dapr/AdminPanel.Host/Dockerfile
          - image: openmu-central
            dockerfile: src/Dapr/CentralServer.Host/Dockerfile
          - image: openmu-game
            dockerfile: src/Dapr/GameServer.Host/Dockerfile
          - image: openmu-discord
            dockerfile: src/Dapr/Discord.Host/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: src
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            munique/${{ matrix.image }}:${{ needs.check.outputs.version }}
            munique/${{ matrix.image }}:latest
