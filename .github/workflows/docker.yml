name: Docker images

# The images are built for every push to master and for pull requests, to verify that they can be built.
# When a version tag (e.g. v1.2.3) is pushed, they are built for all supported platforms and published
# to Docker Hub with the version (1.2.3) and 'latest' as tags.
# Publishing requires the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: openmu
            dockerfile: src/Startup/Dockerfile
          - image: openmu-admin
            dockerfile: src/Dapr/AdminPanel.Host/Dockerfile
          - image: openmu-chat
            dockerfile: src/Dapr/ChatServer.Host/Dockerfile
          - image: openmu-connect
            dockerfile: src/Dapr/ConnectServer.Host/Dockerfile
          - image: openmu-friend
            dockerfile: src/Dapr/FriendServer.Host/Dockerfile
          - image: openmu-game
            dockerfile: src/Dapr/GameServer.Host/Dockerfile
          - image: openmu-guild
            dockerfile: src/Dapr/GuildServer.Host/Dockerfile
          - image: openmu-login
            dockerfile: src/Dapr/LoginServer.Host/Dockerfile

    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: munique/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: src
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64,linux/arm/v7' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
