{{- $db := printf "Server=%s;Port=%v;Database=%s;Command Timeout=120;" (include "openmu.databaseHost" .) .Values.database.port .Values.database.name -}}
{{- $admin := printf "%sUser Id=%s;Password=%s;" $db .Values.database.adminUser .Values.database.adminPassword -}}
# The connection strings, which the OpenMU services read through the dapr secret store "secrets".
# The name is fixed: the services look for the secret "connectionStrings", with one key per context.
# The roles config, account, friend and guild are created by the setup in the admin panel.
apiVersion: v1
kind: Secret
metadata:
  name: connectionstrings
  labels:
    {{- include "openmu.labels" . | nindent 4 }}
type: Opaque
stringData:
  MUnique.OpenMU.Persistence.EntityFramework.EntityDataContext: {{ $admin | quote }}
  MUnique.OpenMU.Persistence.EntityFramework.AdminAuth.AdminPanelContext: {{ $admin | quote }}
  MUnique.OpenMU.Persistence.EntityFramework.TypedContext: {{ $admin | quote }}
  MUnique.OpenMU.Persistence.EntityFramework.ConfigurationContext: {{ printf "%sUser Id=config;Password=config;" $db | quote }}
  MUnique.OpenMU.Persistence.EntityFramework.AccountContext: {{ printf "%sUser Id=account;Password=account;" $db | quote }}
  MUnique.OpenMU.Persistence.EntityFramework.TradeContext: {{ printf "%sUser Id=account;Password=account;" $db | quote }}
  MUnique.OpenMU.Persistence.EntityFramework.FriendContext: {{ printf "%sUser Id=friend;Password=friend;" $db | quote }}
  MUnique.OpenMU.Persistence.EntityFramework.GuildContext: {{ printf "%sUser Id=guild;Password=guild;" $db | quote }}
{{- if .Values.infrastructure.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openmu.fullname" . }}-database
  labels:
    {{- include "openmu.labels" . | nindent 4 }}
type: Opaque
stringData:
  adminUser: {{ .Values.database.adminUser | quote }}
  adminPassword: {{ .Values.database.adminPassword | quote }}
{{- end }}
{{- if .Values.adminPanel.bootstrapUser.name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openmu.fullname" . }}-admin-bootstrap
  labels:
    {{- include "openmu.labels" . | nindent 4 }}
type: Opaque
stringData:
  name: {{ .Values.adminPanel.bootstrapUser.name | quote }}
  password: {{ required "adminPanel.bootstrapUser.password is required with a bootstrap user" .Values.adminPanel.bootstrapUser.password | quote }}
{{- end }}
