# Optional monitoring stack for the all-in-one deployment with Traefik. Add it with another -f parameter, e.g.:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#   docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d
# OpenMU then exports its logs, metrics and traces with OpenTelemetry (OTLP), and Grafana is
# available under /grafana/ of the admin panel host, with the login of the admin panel.
services:
  openmu-startup:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
    depends_on:
      - otel-lgtm

  otel-lgtm:
    # OpenTelemetry collector, Loki (logs), Prometheus (metrics), Tempo (traces) and Grafana in one container.
    # It's intended for development, demo and testing environments. For bigger production setups,
    # replace it by dedicated deployments of these components - OpenMU just needs the OTLP endpoint.
    image: grafana/otel-lgtm:0.35.0
    container_name: otel-lgtm
    restart: unless-stopped
    networks:
      - proxy
    expose:
      - "3000" # Grafana, reachable through Traefik
      - "4317" # OTLP gRPC
      - "4318" # OTLP HTTP
    environment:
      # The public address of Grafana, e.g. https://example.org/grafana/ when you use HTTPS.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://admin.docker.localhost/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Grafana relies on the admin panel login: Traefik asks the admin panel and passes
      # the user and its Grafana role in the X-OpenMU-User and X-OpenMU-Grafana-Role headers.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-OpenMU-User
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_HEADERS: Role:X-OpenMU-Grafana-Role
      GF_AUTH_PROXY_SYNC_TTL: "1" # minutes until a changed role is applied
      GF_USERS_AUTO_ASSIGN_ORG: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true" # allows the viewers to use Explore for logs and traces
    volumes:
      - otel-lgtm-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # No host in the rule, so that it works for the host of the admin panel in both compose files.
      # The priority has to be higher than the one of the admin panel router, which matches all paths.
      - "traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.priority=1000"
      - "traefik.http.routers.grafana.middlewares=grafana-auth,grafana-headers"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      # Asks the admin panel whether the cookie of the request belongs to a logged in user. If so, the user
      # and its role are passed to Grafana. These headers are always overwritten, so they can't come from the client.
      # Without a login, the admin panel redirects to its login page.
      - "traefik.http.middlewares.grafana-auth.forwardauth.address=http://openmu-startup:8080/auth/proxy?loginRedirect=true"
      - "traefik.http.middlewares.grafana-auth.forwardauth.authResponseHeaders=X-OpenMU-User,X-OpenMU-Grafana-Role"
      - "traefik.http.middlewares.grafana-headers.headers.customrequestheaders.Authorization="

volumes:
  otel-lgtm-data:
