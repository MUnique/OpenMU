events {
}

http {
    # this is required to proxy Grafana Live WebSocket connections.
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    # Grafana relies on the admin panel login, see location /_openmu_auth.
    map $openmu_role $grafana_role {
      Administrator Admin;
      Operator Editor;
      default Viewer;
    }

    # The path of the request without the leading slash and the query, to return to it after the login.
    map $request_uri $request_path {
      ~^/(?<path>[^?]*) $path;
    }

  server {
    listen 80;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    resolver 127.0.0.11 ipv6=off;

    # Grafana of the optional monitoring stack, see docker-compose.monitoring.yml.
    # The upstream is a variable, so that nginx starts without it, too.
    location /grafana/ {
        auth_request /_openmu_auth;
        auth_request_set $openmu_user $upstream_http_x_openmu_user;
        auth_request_set $openmu_role $upstream_http_x_openmu_role;
        error_page 401 = @admin_panel_login;

        set $grafana otel-lgtm:3000;
        proxy_set_header Host $http_host;
        proxy_pass http://$grafana;

        # Grafana trusts these headers. They are always overwritten, so they can't come from the client.
        proxy_set_header X-WEBAUTH-USER $openmu_user;
        proxy_set_header X-WEBAUTH-ROLE $grafana_role;
        proxy_set_header Authorization "";
    }

    # Proxy Grafana Live WebSocket connections.
    location /grafana/api/live {
        auth_request /_openmu_auth;
        auth_request_set $openmu_user $upstream_http_x_openmu_user;
        auth_request_set $openmu_role $upstream_http_x_openmu_role;
        error_page 401 = @admin_panel_login;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;

        set $grafana otel-lgtm:3000;
        proxy_pass http://$grafana;

        # Grafana trusts these headers. They are always overwritten, so they can't come from the client.
        proxy_set_header X-WEBAUTH-USER $openmu_user;
        proxy_set_header X-WEBAUTH-ROLE $grafana_role;
        proxy_set_header Authorization "";
    }

    # Asks the admin panel whether the cookie of the original request belongs to a logged in user.
    # If so, it answers with the name and role of the user in the X-OpenMU-User and X-OpenMU-Role headers.
    location = /_openmu_auth {
        internal;
        set $admin_panel openmu-startup:8080;
        proxy_pass http://$admin_panel/auth/proxy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location @admin_panel_login {
        # The return url has to be relative to the admin panel.
        return 302 /login?returnUrl=$request_path;
    }

    location / {
       proxy_pass http://openmu-startup:8080;
    }
  }
}