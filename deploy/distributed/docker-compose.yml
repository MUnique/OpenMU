volumes:
  adminpanel-keys:
  dbdata:
  otel-lgtm-data:

# Every OpenMU service gets a dapr sidecar in its own container. The service reaches its sidecar
# through the DAPR_HTTP_ENDPOINT and DAPR_GRPC_ENDPOINT, the sidecar reaches the service through
# its -app-channel-address. This way, each of them can be restarted without breaking the other one,
# e.g. when a game server process ends to apply a changed configuration.
# The game servers share the app id "game-server": nothing addresses a game server by its app id,
# the calls to game servers are published to all of them. The POD_NAME of a sidecar names its
# queues in RabbitMQ (see dapr-components/pubsub.yaml), so it must be unique.
x-dapr-sidecar: &dapr-sidecar
  image: "daprio/daprd:latest"
  restart: unless-stopped
  depends_on:
    dapr-placement:
      condition: service_started
    rabbit:
      condition: service_healthy
    redis-state:
      condition: service_healthy
  volumes:
    - "./dapr-components/:/components"

# The OpenMU services report on /health/ready whether they can do their work, e.g. that the database is
# installed. Nothing waits for it, because the central and game servers aren't ready before the setup.
x-openmu-healthcheck: &openmu-healthcheck
  test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 60s

services:
  nginx-80:
    image: nginx:alpine
    container_name: nginx-80
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf
    depends_on:
      - otel-lgtm

  otel-lgtm:
    # OpenTelemetry collector, Loki (logs), Prometheus (metrics), Tempo (traces) and Grafana in one container.
    # It's intended for development, demo and testing environments. For bigger production setups,
    # replace it by dedicated deployments of these components - the OpenMU services just need the OTLP endpoint.
    image: grafana/otel-lgtm:0.35.0
    container_name: otel-lgtm
    restart: always
    expose:
      - "3000" # Grafana, reachable through nginx
      - "4317" # OTLP gRPC
      - "4318" # OTLP HTTP
    environment:
      GF_SERVER_ROOT_URL: http://localhost/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Grafana relies on the admin panel login: nginx asks the admin panel and passes
      # the user and its role in the X-WEBAUTH-USER and X-WEBAUTH-ROLE headers.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_HEADERS: Role:X-WEBAUTH-ROLE
      GF_AUTH_PROXY_SYNC_TTL: "1" # minutes until a changed role is applied
      GF_USERS_AUTO_ASSIGN_ORG: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true" # allows the viewers to use Explore for logs and traces
    volumes:
      - otel-lgtm-data:/data

  redis-state:
    image: redis
    restart: unless-stopped
    ports:
      - 6379
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  dapr-placement:
    image: "daprio/dapr"
    container_name: dapr_placement
    restart: unless-stopped
    command: ["./placement", "-port", "50006"]
    ports:
      - "50006"

  rabbit:
    image: rabbitmq:3-management-alpine
    container_name: pubsub_rabbitmq
    restart: unless-stopped
    ports:
      - "5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  database:
    image: postgres
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_ADMIN_PW:-admin}
      POSTGRES_DB: ${DB_NAME:-openmu}
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
    ports:
      - "5432"
    volumes:
      - dbdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  centralServer:
    # Hosts the connect, login, guild, friend and chat servers.
    image: munique/openmu-central
    container_name: centralServer
    restart: unless-stopped
    healthcheck: *openmu-healthcheck
    build:
      context: ../../src
      dockerfile: Dapr/CentralServer.Host/Dockerfile
    ports:
      - "44405:44405" # connect server of the first client version
      - "44406:44406" # connect server of the second client version, e.g. of season 6
      - "55980:55980" # chat server
    environment:
      DAPR_HTTP_ENDPOINT: http://centralServer-dapr:3500
      DAPR_GRPC_ENDPOINT: http://centralServer-dapr:50001
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      DB_HOST: ${DB_HOST:-database}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PW: ${DB_ADMIN_PW:-}
    depends_on:
      centralServer-dapr:
        condition: service_started
      database:
        condition: service_healthy
      otel-lgtm:
        condition: service_started

  centralServer-dapr:
    <<: *dapr-sidecar
    container_name: centralServer_dapr
    environment:
      POD_NAME: centralServer
    command: [ "./daprd", "-app-id", "central-server", "-app-port", "8080",
                "-app-channel-address", "centralServer",
                "-dapr-listen-addresses", "0.0.0.0",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]

  adminPanel:
    image: munique/openmu-admin
    container_name: adminPanel
    restart: unless-stopped
    healthcheck: *openmu-healthcheck
    build:
      context: ../../src
      dockerfile: Dapr/AdminPanel.Host/Dockerfile
    depends_on:
      adminPanel-dapr:
        condition: service_started
      database:
        condition: service_healthy
    ports:
      - "8080"
    environment:
      DAPR_HTTP_ENDPOINT: http://adminPanel-dapr:3500
      DAPR_GRPC_ENDPOINT: http://adminPanel-dapr:50001
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      PATH_BASE: /admin/
      DB_HOST: ${DB_HOST:-database}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PW: ${DB_ADMIN_PW:-}
      # Optional bootstrap admin panel user. Without it, the admin panel is reachable
      # without a login until the first user has been created within the panel itself.
      OPENMU_ADMIN_USER: ${OPENMU_ADMIN_USER:-}
      OPENMU_ADMIN_PASSWORD: ${OPENMU_ADMIN_PASSWORD:-}
      # Optional base32 TOTP secret, if the bootstrap user should require a second factor.
      OPENMU_ADMIN_TOTP_SECRET: ${OPENMU_ADMIN_TOTP_SECRET:-}
      # website authenticates itself at the public API under /api.
    volumes:
      - adminpanel-keys:/app/data-protection-keys

  adminPanel-dapr:
    <<: *dapr-sidecar
    container_name: adminPanel_dapr
    environment:
      POD_NAME: adminPanel
    command: [ "./daprd", "-app-id", "admin-panel", "-app-port", "8080",
                "-app-channel-address", "adminPanel",
                "-dapr-listen-addresses", "0.0.0.0",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]

  gameServer0:
    image: munique/openmu-game
    container_name: gameServer0
    restart: unless-stopped
    healthcheck: *openmu-healthcheck
    build:
      context: ../../src
      dockerfile: Dapr/GameServer.Host/Dockerfile
    ports:
      - "8080"
      - "55901:55901"
      - "55902:55902"
    environment:
      GS_ID: 0
      DAPR_HTTP_ENDPOINT: http://gameServer0-dapr:3500
      DAPR_GRPC_ENDPOINT: http://gameServer0-dapr:50001
      PATH_BASE: /gameServer/0/
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      DB_HOST: ${DB_HOST:-database}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PW: ${DB_ADMIN_PW:-}
    depends_on:
      gameServer0-dapr:
        condition: service_started
      centralServer:
        condition: service_started
      database:
        condition: service_healthy
      otel-lgtm:
        condition: service_started

  gameServer0-dapr:
    <<: *dapr-sidecar
    container_name: gameserver0_dapr
    environment:
      POD_NAME: gameServer0
    command: [ "./daprd", "-app-id", "game-server", "-app-port", "8080",
                "-app-channel-address", "gameServer0",
                "-dapr-listen-addresses", "0.0.0.0",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]

  gameServer1:
    image: munique/openmu-game
    container_name: gameServer1
    restart: unless-stopped
    healthcheck: *openmu-healthcheck
    build:
      context: ../../src
      dockerfile: Dapr/GameServer.Host/Dockerfile
    ports:
      - "8080"
      - "55903:55903"
      - "55904:55904"
    environment:
      GS_ID: 1
      DAPR_HTTP_ENDPOINT: http://gameServer1-dapr:3500
      DAPR_GRPC_ENDPOINT: http://gameServer1-dapr:50001
      PATH_BASE: /gameServer/1/
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      DB_HOST: ${DB_HOST:-database}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PW: ${DB_ADMIN_PW:-}
    depends_on:
      gameServer1-dapr:
        condition: service_started
      centralServer:
        condition: service_started
      database:
        condition: service_healthy
      otel-lgtm:
        condition: service_started

  gameServer1-dapr:
    <<: *dapr-sidecar
    container_name: gameserver1_dapr
    environment:
      POD_NAME: gameServer1
    command: [ "./daprd", "-app-id", "game-server", "-app-port", "8080",
                "-app-channel-address", "gameServer1",
                "-dapr-listen-addresses", "0.0.0.0",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]
