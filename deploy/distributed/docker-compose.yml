volumes:
  adminpanel-keys:
  dbdata:
  otel-lgtm-data:

services:
  nginx-80:
    image: nginx:alpine
    container_name: nginx-80
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf
    depends_on:
      - otel-lgtm

  otel-lgtm:
    # OpenTelemetry collector, Loki (logs), Prometheus (metrics), Tempo (traces) and Grafana in one container.
    # It's intended for development, demo and testing environments. For bigger production setups,
    # replace it by dedicated deployments of these components - the OpenMU services just need the OTLP endpoint.
    image: grafana/otel-lgtm:0.35.0
    container_name: otel-lgtm
    restart: always
    expose:
      - "3000" # Grafana, reachable through nginx
      - "4317" # OTLP gRPC
      - "4318" # OTLP HTTP
    environment:
      GF_SERVER_ROOT_URL: http://localhost/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Grafana relies on the admin panel login: nginx asks the admin panel and passes
      # the user and its role in the X-WEBAUTH-USER and X-WEBAUTH-ROLE headers.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_HEADERS: Role:X-WEBAUTH-ROLE
      GF_AUTH_PROXY_SYNC_TTL: "1" # minutes until a changed role is applied
      GF_USERS_AUTO_ASSIGN_ORG: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true" # allows the viewers to use Explore for logs and traces
    volumes:
      - otel-lgtm-data:/data

  redis-state:
    image: redis
    restart: always
    ports:
      - 6379
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"

  dapr-placement:
    image: "daprio/dapr"
    container_name: dapr_placement
    command: ["./placement", "-port", "50006"]
    ports:
      - "50006"

  rabbit:
    image: rabbitmq:3-management-alpine
    container_name: pubsub_rabbitmq
    restart: always
    ports:
      - "5672"

  database:
    image: postgres
    container_name: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_ADMIN_PW:-admin}
      POSTGRES_DB: ${DB_NAME:-openmu}
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
    ports:
      - "5432"
    volumes:
      - dbdata:/var/lib/postgresql

  centralServer:
    # Hosts the connect, login, guild, friend and chat server.
    image: munique/openmu-central
    container_name: centralServer
    ports:
      - "50001"
      - "44405:44405" # connect server
      - "55980:55980" # chat server
    environment:
      APPID: centralServer
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      DB_HOST: ${DB_HOST:-database}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PW: ${DB_ADMIN_PW:-}
    depends_on:
      - rabbit
      - redis-state
      - otel-lgtm
      - database

  centralServer-dapr:
    image: "daprio/daprd:latest"
    container_name: centralServer_dapr
    command: [ "./daprd", "-app-id", "centralServer", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]
    depends_on:
      - centralServer
    network_mode: "service:centralServer"
    volumes:
      - "./dapr-components/:/components"

  adminPanel:
    image: munique/openmu-admin
    container_name: adminPanel
    depends_on:
      - database
    ports:
      - "8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      PATH_BASE: /admin/
      DB_HOST: ${DB_HOST:-database}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PW: ${DB_ADMIN_PW:-}
      # Optional bootstrap admin panel user. Without it, the admin panel is reachable
      # without a login until the first user has been created within the panel itself.
      OPENMU_ADMIN_USER: ${OPENMU_ADMIN_USER:-}
      OPENMU_ADMIN_PASSWORD: ${OPENMU_ADMIN_PASSWORD:-}
      # Optional base32 TOTP secret, if the bootstrap user should require a second factor.
      OPENMU_ADMIN_TOTP_SECRET: ${OPENMU_ADMIN_TOTP_SECRET:-}
      # website authenticates itself at the public API under /api.
    volumes:
      - adminpanel-keys:/app/data-protection-keys

  adminPanel-dapr:
    image: "daprio/daprd:latest"
    container_name: adminPanel_dapr
    command: [ "./daprd", "-app-id", "adminPanel", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]

    depends_on:
      - adminPanel
    network_mode: "service:adminPanel"
    volumes:
      - "./dapr-components/:/components"

  gameServer0:
    image: munique/openmu-game
    container_name: gameServer0
    build:
      context: ../../src
      dockerfile: Dapr/GameServer.Host/Dockerfile
    ports:
      - "8080"
      - "50001"
      - "55901:55901"
      - "55902:55902"
    environment:
      GS_ID: 0
      APPID: gameServer0
      PATH_BASE: /gameServer/0/
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      DB_HOST: ${DB_HOST:-database}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PW: ${DB_ADMIN_PW:-}
    depends_on:
      - centralServer-dapr
      - rabbit
      - otel-lgtm
      - database

  gameServer0-dapr:
    image: "daprio/daprd:latest"
    container_name: gameserver0_dapr
    command: [ "./daprd", "-app-id", "gameServer0", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]
    depends_on:
      - gameServer0
    network_mode: "service:gameServer0"
    volumes:
      - "./dapr-components/:/components"
  
  gameServer1:
    image: munique/openmu-game
    container_name: gameServer1
    build:
      context: ../../src
      dockerfile: Dapr/GameServer.Host/Dockerfile
    ports:
      - "8080"
      - "50001"
      - "55903:55903"
      - "55904:55904"
    environment:
      GS_ID: 1
      APPID: gameServer1
      PATH_BASE: /gameServer/1/
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      DB_HOST: ${DB_HOST:-database}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PW: ${DB_ADMIN_PW:-}
    depends_on:
      - centralServer-dapr
      - rabbit
      - otel-lgtm
      - database

  gameServer1-dapr:
    image: "daprio/daprd:latest"
    container_name: gameserver1_dapr
    command: [ "./daprd", "-app-id", "gameServer1", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]
    depends_on:
      - gameServer1
    network_mode: "service:gameServer1"
    volumes:
      - "./dapr-components/:/components"