volumes:
  adminpanel-keys:
  dbdata:
  otel-lgtm-data:

services:
  nginx-80:
    image: nginx:alpine
    container_name: nginx-80
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf
    depends_on:
      - otel-lgtm

  otel-lgtm:
    # OpenTelemetry collector, Loki (logs), Prometheus (metrics), Tempo (traces) and Grafana in one container.
    # It's intended for development, demo and testing environments. For bigger production setups,
    # replace it by dedicated deployments of these components - the OpenMU services just need the OTLP endpoint.
    image: grafana/otel-lgtm:0.35.0
    container_name: otel-lgtm
    restart: always
    expose:
      - "3000" # Grafana, reachable through nginx
      - "4317" # OTLP gRPC
      - "4318" # OTLP HTTP
    environment:
      GF_SERVER_ROOT_URL: http://localhost/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Grafana relies on the authentication by nginx, which passes the user in the X-WEBAUTH-USER header.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_USERS_AUTO_ASSIGN_ORG: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
    volumes:
      - otel-lgtm-data:/data

  redis-state:
    image: redis
    restart: always
    ports:
      - 6379
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"

  dapr-placement:
    image: "daprio/dapr"
    container_name: dapr_placement
    command: ["./placement", "-port", "50006"]
    ports:
      - "50006"

  rabbit:
    image: rabbitmq:3-management-alpine
    container_name: pubsub_rabbitmq
    restart: always
    ports:
      - "5672"

  database:
    image: postgres
    container_name: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_ADMIN_PW:-admin}
      POSTGRES_DB: ${DB_NAME:-openmu}
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
    ports:
      - "5432"
    volumes:
      - dbdata:/var/lib/postgresql

  connectServer:
    image: munique/openmu-connect
    container_name: connectServer
    ports:
      - "50001"
      - "44405:44405"
    environment:
      APPID: connectServer
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      DB_HOST: ${DB_HOST:-database}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PW: ${DB_ADMIN_PW:-}
    depends_on:
      - rabbit
      - otel-lgtm
      - database

  connectServer-dapr:
    image: "daprio/daprd:latest"
    container_name: connectServer_dapr
    command: [ "./daprd", "-app-id", "connectServer", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]
    depends_on:
      - connectServer
    network_mode: "service:connectServer"
    volumes:
      - "./dapr-components/:/components"

  loginServer:
    image: munique/openmu-login
    container_name: loginServer
    ports:
      - "50001"
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      DB_HOST: ${DB_HOST:-database}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PW: ${DB_ADMIN_PW:-}
    depends_on:
      - otel-lgtm
      - database

  loginServer-dapr:
    image: "daprio/daprd:latest"
    container_name: loginServer_dapr
    command: [ "./daprd", "-app-id", "loginServer", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]
    depends_on:
      - loginServer
    network_mode: "service:loginServer"
    volumes:
      - "./dapr-components/:/components"

  friendServer:
    image: munique/openmu-friend
    container_name: friendServer
    ports:
      - "50001"
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      DB_HOST: ${DB_HOST:-database}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PW: ${DB_ADMIN_PW:-}
    depends_on:
      - chatServer-dapr
      - database
      - otel-lgtm

  friendServer-dapr:
    image: "daprio/daprd:latest"
    container_name: friendServer_dapr
    command: [ "./daprd", "-app-id", "friendServer", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]
    depends_on:
      - friendServer
    network_mode: "service:friendServer"
    volumes:
      - "./dapr-components/:/components"
  
  guildServer:
    image: munique/openmu-guild
    container_name: guildServer
    ports:
      - "50001"
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      DB_HOST: ${DB_HOST:-database}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PW: ${DB_ADMIN_PW:-}
    depends_on:
      - database
      - otel-lgtm

  guildServer-dapr:
    image: "daprio/daprd:latest"
    container_name: guildServer_dapr
    command: [ "./daprd", "-app-id", "guildServer", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]
    depends_on:
      - guildServer
    network_mode: "service:guildServer"
    volumes:
      - "./dapr-components/:/components"

  chatServer:
    image: munique/openmu-chat
    container_name: chatServer
    environment:
      APPID: chatServer
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      DB_HOST: ${DB_HOST:-database}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PW: ${DB_ADMIN_PW:-}
    ports:
      - "55980:55980"
      - "50001"
    depends_on:
      - database
      - otel-lgtm

  chatServer-dapr:
    image: "daprio/daprd:latest"
    container_name: chatServer_dapr
    command: [ "./daprd", "-app-id", "chatServer", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]
    depends_on:
      - chatServer
    network_mode: "service:chatServer"
    volumes:
      - "./dapr-components/:/components"


  adminPanel:
    image: munique/openmu-admin
    container_name: adminPanel
    depends_on:
      - database
    ports:
      - "8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      PATH_BASE: /admin/
      DB_HOST: ${DB_HOST:-database}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PW: ${DB_ADMIN_PW:-}
      # Optional bootstrap admin panel user. Without it, the admin panel is reachable
      # without a login until the first user has been created within the panel itself.
      OPENMU_ADMIN_USER: ${OPENMU_ADMIN_USER:-}
      OPENMU_ADMIN_PASSWORD: ${OPENMU_ADMIN_PASSWORD:-}
      # Optional base32 TOTP secret, if the bootstrap user should require a second factor.
      OPENMU_ADMIN_TOTP_SECRET: ${OPENMU_ADMIN_TOTP_SECRET:-}
      # website authenticates itself at the public API under /api.
    volumes:
      - adminpanel-keys:/app/data-protection-keys

  adminPanel-dapr:
    image: "daprio/daprd:latest"
    container_name: adminPanel_dapr
    command: [ "./daprd", "-app-id", "adminPanel", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]

    depends_on:
      - adminPanel
    network_mode: "service:adminPanel"
    volumes:
      - "./dapr-components/:/components"

  gameServer0:
    image: munique/openmu-game
    container_name: gameServer0
    build:
      context: ../../src
      dockerfile: Dapr/GameServer.Host/Dockerfile
    ports:
      - "8080"
      - "50001"
      - "55901:55901"
      - "55902:55902"
    environment:
      GS_ID: 0
      APPID: gameServer0
      PATH_BASE: /gameServer/0/
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      DB_HOST: ${DB_HOST:-database}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PW: ${DB_ADMIN_PW:-}
    depends_on:
      - connectServer-dapr
      - loginServer-dapr
      - friendServer-dapr
      - rabbit
      - otel-lgtm
      - database

  gameServer0-dapr:
    image: "daprio/daprd:latest"
    container_name: gameserver0_dapr
    command: [ "./daprd", "-app-id", "gameServer0", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]
    depends_on:
      - gameServer0
    network_mode: "service:gameServer0"
    volumes:
      - "./dapr-components/:/components"
  
  gameServer1:
    image: munique/openmu-game
    container_name: gameServer1
    build:
      context: ../../src
      dockerfile: Dapr/GameServer.Host/Dockerfile
    ports:
      - "8080"
      - "50001"
      - "55903:55903"
      - "55904:55904"
    environment:
      GS_ID: 1
      APPID: gameServer1
      PATH_BASE: /gameServer/1/
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      DB_HOST: ${DB_HOST:-database}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PW: ${DB_ADMIN_PW:-}
    depends_on:
      - connectServer-dapr
      - loginServer-dapr
      - friendServer-dapr
      - rabbit
      - otel-lgtm
      - database

  gameServer1-dapr:
    image: "daprio/daprd:latest"
    container_name: gameserver1_dapr
    command: [ "./daprd", "-app-id", "gameServer1", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]
    depends_on:
      - gameServer1
    network_mode: "service:gameServer1"
    volumes:
      - "./dapr-components/:/components"