services:
  database:
    ports:
      - "5433:5432"
  otel-lgtm:
    environment:
      # Grafana without login, for local testing only.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      # OTLP endpoints for services which are started from the IDE, outside of docker.
      - "4317:4317"
      - "4318:4318"

  redis-state:
    ports:
      - "6379:6379"
  
  gameServer0:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "81:8080"

  gameServer1:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "82:8080"

  connectServer:
    build:
      context: ../../src
      dockerfile: Dapr/ConnectServer.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  loginServer:
    build:
      context: ../../src
      dockerfile: Dapr/LoginServer.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  friendServer:
    build:
      context: ../../src
      dockerfile: Dapr/FriendServer.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  guildServer:
    build:
      context: ../../src
      dockerfile: Dapr/GuildServer.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  chatServer:
    build:
      context: ../../src
      dockerfile: Dapr/ChatServer.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  adminPanel:
    build:
      context: ../../src
      dockerfile: Dapr/AdminPanel.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "88:8080"